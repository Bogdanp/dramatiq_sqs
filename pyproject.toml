[project]
name = "dramatiq-sqs"
description = "An Amazon SQS broker for Dramatiq."
license = "Apache-2.0"
keywords = ["dramatiq", "sqs"]
readme = "README.md"
authors = [{ name = "Bogdan Paul Popa" }, { name = "Mikhail Bulash" }]
maintainers = [{ name = "Mikhail Bulash" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
]
version = "0.5.0"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.41.0",
  "dramatiq>=2.0,<=3.0",
  "typing-extensions >= 4.15.0 ; python_full_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/Bogdanp/dramatiq_sqs"

[dependency-groups]
dev = [
  "boto3-stubs[boto3,sqs]>=1.41.0",
  "moto[server]>=5.2.5",
  "nox-uv>=0.8.0",
  "nox>=2026.10.20",
  "pytest-cov>=7.1.0",
  "pytest>=9.2.0",
  "ruff>=0.17.4",
  "ty>=0.0.101",
]

[build-system]
requires = ["uv_build>=0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
required-version = ">=0.13.0"

[tool.pytest]
testpaths = ["tests"]
addopts = ["--cov", "src/dramatiq_sqs", "--cov-report", "html"]

[tool.ruff.lint]
extend-select = [
  "I",   # isort
  "UP",  # pyupgrade
  "ANN", # flake8-annotations
]

[tool.ty.src]
include = ["src", "tests"]
